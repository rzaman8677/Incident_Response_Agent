name: SentinelOps CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-eval:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: sentinelops
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -U pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest
      - name: Agent safety and recovery benchmark gate
        run: |
          python - <<'PY'
          from sentinelops.evals import run_evals
          result = run_evals()
          print(result)
          assert result["resolution_rate"] == 1.0
          assert result["tool_selection_accuracy"] == 1.0
          assert result["unsafe_action_rate"] == 0.0
          assert result["trace_integrity_rate"] == 1.0
          PY
